*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Amiri','Cormorant Garamond',Georgia,serif;overflow-x:hidden}
.corners{position:relative}
.corners:before,.corners:after{content:"";position:absolute;width:min(62vw,300px);aspect-ratio:327/380;background-size:contain;background-repeat:no-repeat;pointer-events:none;z-index:0}
.corners:before{top:0;left:0;background-image:var(--tl);background-position:top left}
.corners:after{bottom:0;right:0;background-image:var(--br);background-position:bottom right}
.corners>*{position:relative;z-index:1}
.frame{position:absolute;inset:14px;border:1.5px solid var(--gold);pointer-events:none;z-index:1}
.frame:after{content:"";position:absolute;inset:4px;border:1px solid var(--gold2)}
.lang{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:10px;z-index:30;display:flex;gap:3px;background:#f6efe2e6;backdrop-filter:blur(6px);border:1px solid var(--gold);border-radius:20px;padding:3px}
.lang button{border:0;background:none;color:var(--wine);padding:5px 11px;border-radius:16px;font:700 14px 'Cormorant Garamond',serif;cursor:pointer}
.lang button.on{background:var(--wine);color:var(--cream)}
#music{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-start:14px;z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:var(--wine);color:var(--gold2);font-size:20px;cursor:pointer;display:none}
#music.off{opacity:.55}
.title{font-family:'Aref Ruqaa',serif;font-size:clamp(48px,14vw,80px);color:var(--wine);margin:0 0 16px;line-height:1.3}
body:not([data-l=ar]) .title{font:400 clamp(46px,13vw,76px) 'Great Vibes',cursive}
.sub{font:600 15px 'Cormorant Garamond',serif;letter-spacing:5px;text-transform:uppercase;color:var(--wine)}
.dv{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:6px auto;max-width:300px}
.dv:before,.dv:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.dv:after{transform:scaleX(-1)}
/* cover */
#cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 26px 50px;overflow:hidden}
.hint{color:var(--gold);font-size:19px;font-weight:700}
.arrow{font-size:28px;color:var(--gold);animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.seal{margin-top:6px;width:250px;height:250px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 28%,#9a2443,#5a0b20);box-shadow:0 16px 36px #5a0b2066,0 0 0 3px var(--gold),0 0 0 9px var(--cream),0 0 0 11px var(--gold);animation:pulse 2.4s infinite;padding:0}
@keyframes pulse{50%{box-shadow:0 16px 40px #5a0b2088,0 0 0 3px var(--gold),0 0 0 9px var(--cream),0 0 0 11px var(--gold),0 0 30px 14px #b8924a55}}
.seal svg{width:100%;height:100%}

#cover{position:relative;display:block;padding:0;min-height:100vh;height:100vh;overflow:hidden;text-align:center}
#cover .env{position:absolute;inset:0;width:100%;height:100%}
#cover .title{position:absolute;left:0;right:0;top:11%;margin:0}
.gold{background:linear-gradient(170deg,#7d5410,#d4a93f 45%,#8a5d12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px #7a561a55)}
.hint2{position:absolute;left:0;right:0;top:calc(46% - 150px);color:#fff;font:700 19px 'Amiri',serif;text-shadow:0 1px 3px #7a561aaa;letter-spacing:.5px}
.arrow2{position:absolute;left:0;right:0;top:calc(46% - 122px);color:#fff;font-size:26px;text-shadow:0 1px 3px #7a561aaa;animation:bob 1.6s infinite}
.wax{position:absolute;left:50%;top:46.5%;width:170px;height:170px;margin:-85px 0 0 -85px;border:0;background:none;padding:0;cursor:pointer;animation:wp 2.4s infinite;transition:transform .6s}
.wax svg{width:100%;height:100%;filter:drop-shadow(0 8px 10px #5a3a1055)}
@keyframes wp{50%{transform:scale(1.07)}}
#cover.opening{animation:openEnv .9s forwards}
#cover.opening .wax{animation:none;transform:scale(.7) rotate(14deg)}
@keyframes openEnv{60%{opacity:1}to{opacity:0;transform:scale(1.18)}}
.lang{background:#fffffff0}
/* details */
#details{display:none}
#details.show{display:block;animation:fade 1.2s}
@keyframes fade{from{opacity:0}}
.hero{text-align:center;padding:70px 20px 30px;overflow:hidden}
.arch{position:relative;width:min(78%,320px);margin:6px auto 0;aspect-ratio:4/5;border-radius:160px 160px 10px 10px;border:3px solid var(--gold);box-shadow:0 0 0 7px var(--cream),0 0 0 9px var(--gold),0 16px 34px #5a0b2055;background:#ddd center/cover no-repeat}
.names{font:400 clamp(48px,14vw,76px) 'Great Vibes',cursive;color:var(--wine);line-height:1.15;margin-top:28px;direction:ltr}
.when{font:600 20px 'Cormorant Garamond',serif;direction:ltr;letter-spacing:1px}
.rings{color:var(--gold);font-size:22px}
section{max-width:580px;margin:0 auto;padding:22px 18px}
.card{background:#fbf7ee;border:1.5px solid var(--gold);border-radius:6px;box-shadow:0 0 0 5px var(--cream),0 0 0 6.5px var(--gold2),0 12px 28px #5a0b2026;padding:30px 22px;text-align:center;overflow:hidden}
.verse{font:400 25px/2.1 'Amiri',serif;color:var(--wine)}
.vsrc{color:var(--gold);font-size:16px;margin-top:6px;font-weight:700}
.tr{font:italic 400 17px/1.6 'Cormorant Garamond',serif;margin-top:10px;direction:ltr}
body[data-l=ar] .tr{display:none}
h2{font:700 28px 'Aref Ruqaa','Cormorant Garamond',serif;color:var(--wine);margin:0 0 10px}
body:not([data-l=ar]) h2{font:700 24px 'Cormorant Garamond',serif;letter-spacing:4px;text-transform:uppercase}
.letter{font-size:21px;line-height:2.1}
body:not([data-l=ar]) .letter{font:500 20px/1.8 'Cormorant Garamond',serif}
.letter p{margin:0 0 12px}
.letter b{color:var(--wine2)}
.letter .bs{font-weight:700;color:var(--wine);font-size:24px}
.dt{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:20px}
.dt span{background:#fff;border:1px solid var(--gold);border-radius:14px;padding:7px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;direction:ltr}
.cal div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font:700 18px 'Cormorant Garamond',serif;border-radius:50%}
.cal .d{font-size:13px;color:var(--gold);aspect-ratio:auto;padding:6px 0}
.cal .hi{background:var(--wine);color:var(--cream);border:2px solid var(--gold);transform:scale(1.12);box-shadow:0 4px 12px #6d0f2766}
.mon{font:700 23px 'Cormorant Garamond',serif;letter-spacing:2px;color:var(--wine)}
.time{font:700 28px 'Cormorant Garamond',serif;margin-top:16px;color:var(--wine)}
.btn{display:inline-block;margin-top:14px;background:var(--wine);color:var(--cream);text-decoration:none;padding:12px 26px;border-radius:30px;border:1.5px solid var(--gold);font:700 17px 'Amiri',serif}
.btn.o{background:none;color:var(--wine)}
.venue{font:700 25px 'Cormorant Garamond',serif;direction:ltr;color:var(--wine)}
.end{padding:20px 20px 90px;text-align:center}
.crestsm{width:96px;display:block;margin:0 auto}
.foot{color:var(--wine);font:400 44px 'Great Vibes',cursive;direction:ltr}

.gb input,.gb textarea{width:100%;border:1px solid var(--gold2);background:#fff;border-radius:18px;padding:14px 16px;font:400 18px 'Amiri','Cormorant Garamond',serif;color:var(--ink);outline:none}
.gb textarea{min-height:120px;resize:vertical}
.gb input:focus,.gb textarea:focus{border-color:var(--wine)}
.gb label{display:block;text-align:start;font:700 16px 'Amiri','Cormorant Garamond',serif;color:var(--wine);margin:14px 4px 6px}
.gb .btn{width:100%;font-size:19px;cursor:pointer;margin-top:18px}
.gb .note{font-size:15px;color:var(--gold);margin-top:10px;min-height:20px}
.wish{background:#fbf7ee;border:1px solid var(--gold2);border-radius:18px;padding:16px 18px;margin-top:14px;text-align:start;box-shadow:0 6px 16px #5a0b2014}
.wish .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wish .n{font:700 20px 'Amiri','Cormorant Garamond',serif;color:var(--wine)}
.wish .d{font:400 14px 'Cormorant Garamond',serif;color:#a08a6a;direction:ltr}
.wish .m{font:italic 400 19px/1.8 'Amiri','Cormorant Garamond',serif;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.wish .del{flex:none;border:0;background:#6d0f27;color:#f6efe2;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1}
.empty{color:#a08a6a;margin-top:16px;font-size:17px}
</style>

letter:"<p class='bs'>بسم الله الرحمن الرحيم</p><p>بقلوبٍ يملؤها الفرحُ، ومشاعرٍ تغمرُها المحبةُ والاعتزازُ، يتشرّفُ السيدُ <b>رشيدٌ</b> والسيدةُ <b>رقيةُ</b> بدعوتِكم لمشاركتِهما فرحةَ زفافِ ابنتِهما المصونةِ <b>هند</b> على زوجِها المصون.</p><p>في ليلةٍ تتزيّنُ بأجملِ معاني الفرحِ، وتُزَفُّ فيها ابنتُهما نحوَ حياةٍ جديدةٍ عنوانُها المودّةُ والرحمةُ، يسعَدُهما أنْ تشاركوهما هذه المناسبةَ الغاليةَ، وأنْ تباركوا للعروسينِ بدايتَهما الجديدةَ بحضورِكم الكريمِ ودعواتِكم الصادقةِ.</p><p>بحضورِكم تكتملُ الفرحةُ، وبمحبّتِكم تزدادُ الليلةُ بهاءً وسرورًا.</p>",

letter:"<p class='bs'>Au nom de Dieu, le Clément, le Miséricordieux</p><p>Le cœur plein de joie, d'affection et de fierté, Monsieur <b>Rachid</b> et Madame <b>Roqaya</b> ont l'honneur de vous convier à partager le bonheur du mariage de leur chère fille <b>Hind</b> avec son époux bien-aimé.</p><p>En une soirée parée des plus beaux sens de la joie, où leur fille s'en va vers une vie nouvelle placée sous le signe de l'affection et de la miséricorde, ils seraient heureux que vous partagiez cette précieuse occasion et que vous bénissiez le nouveau départ des mariés par votre présence bienveillante et vos prières sincères.</p><p>Par votre présence la joie est complète, et par votre affection la soirée gagne en éclat et en bonheur.</p>",

   colle ici l'URL de l'application web Google Apps Script. Vide = enregistré seulement dans le navigateur. */
var GUESTBOOK_URL="";
var GB={
ar:{t:"دفتر التهاني",s:"اتركوا تهانيكم للعروسين",nl:"اسمكم / العائلة",np:"مثال: عائلة العلوي",ml:"رسالة التهنئة",mp:"اكتبوا تهانيكم هنا...",b:"نشر",e:"كونوا أول من يترك تهنئة 🤍",ok:"شكرًا لكم، تم نشر تهنئتكم 🤍",req:"المرجو كتابة الاسم والرسالة"},
fr:{t:"Livre d'or",s:"Laissez vos vœux aux mariés",nl:"Votre nom / famille",np:"Ex. : Famille Mansouri",ml:"Message de félicitations",mp:"Écrivez vos vœux ici...",b:"Publier",e:"Soyez les premiers à laisser un message 🤍",ok:"Merci, votre message est publié 🤍",req:"Merci d'écrire votre nom et un message"},
en:{t:"Guestbook",s:"Leave your wishes for the couple",nl:"Your name / family",np:"e.g. The Mansouri family",ml:"Your message",mp:"Write your wishes here...",b:"Post",e:"Be the first to leave a message 🤍",ok:"Thank you, your message is posted 🤍",req:"Please enter your name and a message"}
};
var gbItems=[],gbLang='ar',gbLast=0,gbKey='',ADMIN=/admin/.test(location.hash+location.search);
function gbFmt(d){var x=new Date(d);if(isNaN(x))return'';return ('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2)+'/'+x.getFullYear()}
function gbId(x){return String(x.id||(new Date(x.date).getTime()+'-'+x.name))}
function gbPost(o){try{fetch(GUESTBOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)})}catch(e){}}
function gbDel(id){
  if(!confirm('حذف هذه الرسالة ؟'))return;
  if(GUESTBOOK_URL&&!gbKey){gbKey=prompt('Admin key')||'';if(!gbKey)return}
  gbItems=gbItems.filter(function(x){return x.id!==id});gbSave(gbItems);gbRender();
  if(GUESTBOOK_URL){gbPost({action:'delete',id:id,key:gbKey});setTimeout(gbLoad,2500)}
}
function gbRender(){
  var box=document.getElementById('gbList');box.innerHTML='';
  if(!gbItems.length){var e=document.createElement('div');e.className='empty';e.style.textAlign='center';e.textContent=GB[gbLang].e;box.appendChild(e);return}
  gbItems.forEach(function(it){
    var w=document.createElement('div');w.className='wish';
    var h=document.createElement('div');h.className='h';
    var n=document.createElement('span');n.className='n';n.textContent=it.name;
    var d=document.createElement('span');d.className='d';d.textContent=gbFmt(it.date);
    h.appendChild(n);h.appendChild(d);
    if(ADMIN){var x=document.createElement('button');x.type='button';x.className='del';x.textContent='✕';x.setAttribute('aria-label','delete');x.onclick=function(){gbDel(it.id)};h.appendChild(x)}
    var m=document.createElement('div');m.className='m';m.textContent='“'+it.msg+'”';
    w.appendChild(h);w.appendChild(m);box.appendChild(w);
  });
}
function GBL(l){
  gbLang=l;var g=GB[l];
  document.getElementById('gbT').textContent=g.t;document.getElementById('gbS').textContent=g.s;
  document.getElementById('gbNL').textContent=g.nl;document.getElementById('gbN').placeholder=g.np;
  document.getElementById('gbML').textContent=g.ml;document.getElementById('gbM').placeholder=g.mp;
  document.getElementById('gbB').textContent='➤  '+g.b;
  gbRender();
}
function gbLocal(){try{return JSON.parse(localStorage.getItem('gb')||'[]').map(function(x){x.id=gbId(x);return x})}catch(e){return[]}}
function gbSave(a){try{localStorage.setItem('gb',JSON.stringify(a.slice(0,200)))}catch(e){}}
function gbLoad(){
  if(!GUESTBOOK_URL){gbItems=gbLocal();gbRender();return}
  fetch(GUESTBOOK_URL+(GUESTBOOK_URL.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(r){return r.json()}).then(function(a){
    if(Array.isArray(a)){gbItems=a.map(function(x){var o={name:String(x.name||''),msg:String(x.msg||''),date:x.date};o.id=gbId({id:x.id,date:x.date,name:o.name});return o});gbSave(gbItems);gbRender()}
  }).catch(function(){gbItems=gbLocal();gbRender()});
}
if(GUESTBOOK_URL)setInterval(gbLoad,30000);
document.getElementById('gbB').onclick=function(){
  var n=document.getElementById('gbN').value.trim().slice(0,40),m=document.getElementById('gbM').value.trim().slice(0,400),note=document.getElementById('gbNote');
  if(!n||!m){note.textContent=GB[gbLang].req;return}
  if(Date.now()-gbLast<5000)return;gbLast=Date.now();
  var it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,msg:m,date:new Date().toISOString()};
  gbItems.unshift(it);gbSave(gbItems);
  if(GUESTBOOK_URL){gbPost(it);setTimeout(gbLoad,2500)}
  document.getElementById('gbN').value='';document.getElementById('gbM').value='';
  note.textContent=GB[gbLang].ok;gbRender();
};
function L(l){
  var t=T[l];document.body.dataset.l=l;
  document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(function(e){var v=t[e.dataset.t];if(e.hasAttribute('data-html'))e.innerHTML=v;else e.textContent=v});
  document.getElementById('dt').innerHTML='<span>'+t.d1+'</span><span>'+t.d2+'</span>';
  GBL(l);document.getElementById('mon').textContent=t.months;
  document.getElementById('time').textContent='🕕 '+t.time;

  document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.s===l)});
  try{localStorage.setItem('lang',l)}catch(e){}
}

/* Musique : mélodie douce (gamme orientale, sons de luth) générée dans le navigateur.
   Pour une vraie chanson : mettre un lien/data: audio dans MUSIC_SRC. */
var MUSIC_SRC="";
var ac,master,timer,playing=false,audioEl;
var F=[293.66,311.13,369.99,392,440,466.16,523.25,587.33];
var MEL=[4,3,2,1,2,3,4,-1,4,5,6,5,4,3,2,-1,3,2,1,0,1,2,3,-1,4,3,2,1,0,-1,0,-1];
var step=0;
function pluck(f,t,d){
  var o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);o2.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+d);o2.stop(t+d);
}
function tick(){
  var t=ac.currentTime+.05,n=MEL[step%MEL.length];
  if(n>=0)pluck(F[n],t,1.6);
  if(step%8===0)pluck(F[0]/2,t,3);
  step++;
}
function startMusic(){
  try{
    if(MUSIC_SRC){audioEl=audioEl||Object.assign(new Audio(MUSIC_SRC),{loop:true});audioEl.play();}
    else{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(!master){master=ac.createGain();master.gain.value=.5;
        var dl=ac.createDelay(),fb=ac.createGain();dl.delayTime.value=.32;fb.gain.value=.38;
        master.connect(ac.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination);}
      ac.resume();timer=setInterval(tick,480);tick();
    }
    playing=true;
  }catch(e){}
  upd();
}
function stopMusic(){
  if(audioEl)audioEl.pause();
  clearInterval(timer);playing=false;upd();
}
function upd(){var b=document.getElementById('music');b.textContent=playing?'♪':'✕';b.classList.toggle('off',!playing)}
document.getElementById('music').onclick=function(){playing?stopMusic():startMusic()};
document.getElementById('open').onclick=function(){
  var c=document.getElementById('cover');c.classList.add('opening');
  startMusic();
  setTimeout(function(){
    c.style.display='none';
    document.getElementById('details').classList.add('show');
    document.getElementById('music').style.display='block';
    window.scrollTo(0,0);
  },850);
};
gbLoad();
</script>
